name: Deploy LibControl Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-functions.yml"

  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22


      - name: Install Firebase CLI
        run: npm install -g firebase-tools


      - name: Install Functions dependencies
        working-directory: functions
        run: npm install


      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      - name: Deploy LibControl Functions
        run: |
          firebase deploy \
            --only functions:createLibraryAdmin,functions:completeAdminPasswordChange,functions:createLibraryStudent \
            --project appointment-app-cb979
