<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#fff3e6"
    >

    <title>Student Self Attendance Register</title>

    <!-- Existing LibControl CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/layout.css"
    >

    <style>

        /* ============================================================
           LibControl - Student Self Attendance Register
           ============================================================ */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #fff3e6;
            color: #000000;
            font-weight: 600;
        }

        body {
            min-height: 100vh;
        }

        .main-content {
            background: #fff3e6;
            min-height: 100vh;
        }

        .self-attendance-register-page {
            padding: 24px;
            min-height: calc(100vh - 80px);
            background: #fff3e6;
        }

        .self-attendance-register-card {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
        }

        /* ------------------------------------------------------------
           Header
           ------------------------------------------------------------ */

        .self-attendance-register-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        .self-attendance-register-title h2 {
            margin: 0;
            color: #000000;
            font-size: 24px;
            font-weight: 800;
        }

        .self-attendance-register-title p {
            margin: 7px 0 0;
            color: #000000;
            font-size: 14px;
            font-weight: 600;
        }

        /* ------------------------------------------------------------
           Filters
           ------------------------------------------------------------ */

        .self-attendance-register-filters {
            display: flex;
            align-items: end;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        .self-attendance-filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .self-attendance-filter-group label {
            color: #000000;
            font-size: 12px;
            font-weight: 800;
        }

        .self-attendance-filter-group input,
        .self-attendance-filter-group select {
            height: 40px;
            padding: 0 11px;
            border: 1px solid #d6d6d6;
            border-radius: 7px;
            background: #ffffff;
            color: #000000;
            font-size: 13px;
            font-weight: 700;
            outline: none;
        }

        .self-attendance-filter-group input:focus,
        .self-attendance-filter-group select:focus {
            border-color: #e85d04;
        }

        /* ------------------------------------------------------------
           Small Search Box
           ------------------------------------------------------------ */

        .self-attendance-search {
            position: relative;
            width: 190px;
        }

        .self-attendance-search input {
            width: 100%;
            height: 40px;
            padding: 0 12px 0 36px;
            border: 1px solid #d6d6d6;
            border-radius: 7px;
            background: #ffffff;
            color: #000000;
            font-size: 13px;
            font-weight: 700;
            outline: none;
        }

        .self-attendance-search input::placeholder {
            color: #555555;
            font-weight: 600;
        }

        .self-attendance-search input:focus {
            border-color: #e85d04;
        }

        .self-attendance-search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #000000;
            font-size: 15px;
            pointer-events: none;
        }

        /* ------------------------------------------------------------
           Table
           ------------------------------------------------------------ */

        .self-attendance-table-wrap {
            width: 100%;
            overflow-x: auto;
            border-radius: 9px;
        }

        .self-attendance-table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
            color: #000000;
        }

        .self-attendance-table th,
        .self-attendance-table td {
            padding: 14px 15px;
            text-align: left;
            border-bottom: 1px solid #eeeeee;
            white-space: nowrap;
        }

        .self-attendance-table th {
            color: #000000;
            font-size: 13px;
            font-weight: 800;
            background: #fafafa;
        }

        .self-attendance-table td {
            color: #000000;
            font-size: 14px;
            font-weight: 700;
        }

        .self-attendance-table tbody tr:hover {
            background: #fffaf5;
        }

        /* ------------------------------------------------------------
           Shift Badge
           ------------------------------------------------------------ */

        .self-attendance-shift-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #eeeeee;
            color: #000000;
            font-size: 12px;
            font-weight: 800;
        }

        .self-attendance-time {
            color: #000000;
            font-size: 14px;
            font-weight: 800;
        }

        /* ------------------------------------------------------------
           Loading / Empty / Error
           ------------------------------------------------------------ */

        .self-attendance-empty {
            padding: 40px 20px !important;
            text-align: center !important;
            color: #000000;
            font-size: 15px;
            font-weight: 700;
        }

        .self-attendance-status-message {
            margin: 15px 0 0;
            color: #000000;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        .self-attendance-loading {
            padding: 40px 20px;
            color: #000000;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
        }

        .self-attendance-error {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            background: #fff1f1;
            color: #b42318;
            font-size: 14px;
            font-weight: 700;
            display: none;
        }

        /* ------------------------------------------------------------
           Mobile
           ------------------------------------------------------------ */

        @media (max-width: 768px) {

            .self-attendance-register-page {
                padding: 12px;
            }

            .self-attendance-register-title h2 {
                font-size: 21px;
            }

            .self-attendance-register-filters {
                width: 100%;
                justify-content: flex-start;
            }

            .self-attendance-filter-group {
                flex: 1;
                min-width: 120px;
            }

            .self-attendance-filter-group input,
            .self-attendance-filter-group select {
                width: 100%;
            }

            .self-attendance-search {
                width: 170px;
            }

            .self-attendance-table th,
            .self-attendance-table td {
                padding: 12px;
            }
        }

    </style>
</head>

<body>

    <!-- Shared Navbar -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="main-content">

        <div class="self-attendance-register-page">

            <section
                class="dashboard-card self-attendance-register-card"
            >

                <div class="card-header">

                    <div
                        class="self-attendance-register-header"
                    >

                        <div
                            class="self-attendance-register-title"
                        >

                            <h2>
                                Student Self Attendance
                            </h2>

                            <p>
                                QR attendance register
                            </p>

                        </div>

                        <div
                            class="self-attendance-register-filters"
                        >

                            <!-- Small Search -->
                            <div
                                class="self-attendance-search"
                            >

                                <span
                                    class="self-attendance-search-icon"
                                >
                                    🔎
                                </span>

                                <input
                                    type="search"
                                    id="self-attendance-search"
                                    placeholder="Search student..."
                                    autocomplete="off"
                                >

                            </div>

                            <!-- Date -->
                            <div
                                class="self-attendance-filter-group"
                            >

                                <label
                                    for="self-attendance-date"
                                >
                                    Date
                                </label>

                                <input
                                    type="date"
                                    id="self-attendance-date"
                                >

                            </div>

                            <!-- Shift -->
                            <div
                                class="self-attendance-filter-group"
                            >

                                <label
                                    for="self-attendance-shift"
                                >
                                    Shift
                                </label>

                                <select
                                    id="self-attendance-shift"
                                >

                                    <option value="all">
                                        All Shifts
                                    </option>

                                    <option value="Morning">
                                        Morning
                                    </option>

                                    <option value="Afternoon">
                                        Afternoon
                                    </option>

                                    <option value="Evening">
                                        Evening
                                    </option>

                                    <option value="Night">
                                        Night
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="card-body">

                    <div
                        id="self-attendance-register-error"
                        class="self-attendance-error"
                    ></div>

                    <div
                        id="self-attendance-register-loading"
                        class="self-attendance-loading"
                    >
                        Loading attendance...
                    </div>

                    <div
                        id="self-attendance-register-table-wrap"
                        class="self-attendance-table-wrap"
                        style="display: none;"
                    >

                        <table
                            class="self-attendance-table"
                        >

                            <thead>

                                <tr>

                                    <th>
                                        Student ID
                                    </th>

                                    <th>
                                        Student
                                    </th>

                                    <th>
                                        Seat
                                    </th>

                                    <th>
                                        Shift
                                    </th>

                                    <th>
                                        Check-in
                                    </th>

                                    <th>
                                        Leave
                                    </th>

                                </tr>

                            </thead>

                            <tbody
                                id="self-attendance-register-body"
                            >
                            </tbody>

                        </table>

                    </div>

                    <div
                        id="self-attendance-register-empty"
                        class="self-attendance-empty"
                        style="display: none;"
                    >
                        No self attendance records found.
                    </div>

                    <div
                        id="self-attendance-register-status"
                        class="self-attendance-status-message"
                    ></div>

                </div>

            </section>

        </div>

    </main>

    <!-- Firebase -->
    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"
    ></script>

    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"
    ></script>

    <!-- Existing LibControl Dashboard / Session -->
    <script src="../js/dashboard.js"></script>

    <!-- Student Self Attendance Register -->
    <script src="../js/student-self-attendance-register.js"></script>

</body>

</html>
