<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Master Owner Access - LibControl</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>

<body>

<div
    class="gateway-container"
    style="margin:15vh auto;"
>

    <header class="gateway-header">

        <h1>Owner Control Room</h1>

        <p>
            SaaS Network Master Entry Terminal
        </p>

    </header>


    <div class="gateway-card glass">

        <div class="auth-panel active">

            <h2>
                Secure Master Login
            </h2>

            <p class="panel-subtitle">
                Sign in with your authorized master manager account.
            </p>


            <form id="manager-standalone-login-form">

                <div class="form-group">

                    <label for="manager-email-input">
                        Manager Gmail Address
                    </label>

                    <input
                        type="email"
                        id="manager-email-input"
                        placeholder="manager@gmail.com"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="manager-password-input">
                        Master Password
                    </label>

                    <input
                        type="password"
                        id="manager-password-input"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-gateway-submit btn-manager-override"
                    id="manager-login-btn"
                >
                    Execute Authorization
                </button>

            </form>

        </div>

    </div>

</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<!-- Shared Core -->

<script src="../js/dashboard.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const loginForm =
            document.getElementById(
                "manager-standalone-login-form"
            );

        const emailInput =
            document.getElementById(
                "manager-email-input"
            );

        const passwordInput =
            document.getElementById(
                "manager-password-input"
            );

        const loginButton =
            document.getElementById(
                "manager-login-btn"
            );


        if (!loginForm) {
            return;
        }


        loginForm.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    alert(
                        "Please enter Manager Email and Password."
                    );

                    return;
                }


                if (
                    typeof firebase ===
                    "undefined"
                ) {

                    alert(
                        "Security Engine Offline. Please refresh the page."
                    );

                    return;
                }


                if (
                    !firebase.apps.length
                ) {

                    alert(
                        "Firebase security service is not initialized."
                    );

                    return;
                }


                const db =
                    window.db ||
                    firebase.firestore();


                loginButton.disabled = true;

                loginButton.textContent =
                    "Authorizing...";


                try {

                    /*
                     * STEP 1
                     * Firebase Authentication
                     */

                    const credential =
                        await firebase
                            .auth()
                            .signInWithEmailAndPassword(
                                email,
                                password
                            );


                    const user =
                        credential.user;


                    if (!user) {

                        throw new Error(
                            "Manager authentication failed."
                        );

                    }


                    /*
                     * STEP 2
                     * Master Manager Registry
                     *
                     * Document:
                     *
                     * master_managers/{firebase-auth-uid}
                     */

                    const managerDoc =
                        await db
                            .collection(
                                "master_managers"
                            )
                            .doc(user.uid)
                            .get();


                    if (
                        !managerDoc.exists
                    ) {

                        await firebase
                            .auth()
                            .signOut();


                        alert(
                            "Access Denied: This Firebase account is not registered as a Master Manager."
                        );

                        return;
                    }


                    const managerData =
                        managerDoc.data() || {};


                    /*
                     * STEP 3
                     * Authorization State
                     */

                    if (
                        managerData.enabled ===
                        false
                    ) {

                        await firebase
                            .auth()
                            .signOut();


                        alert(
                            "Access Suspended: Master Manager access is disabled."
                        );

                        return;
                    }


                    if (
                        managerData.role !==
                        "master_manager"
                    ) {

                        await firebase
                            .auth()
                            .signOut();


                        alert(
                            "Access Denied: Invalid Manager authorization role."
                        );

                        return;
                    }


                    /*
                     * STEP 4
                     * Create Manager Session
                     */

                    localStorage.setItem(
                        "session_role",
                        "manager"
                    );

                    localStorage.setItem(
                        "session_manager_uid",
                        user.uid
                    );

                    localStorage.setItem(
                        "session_manager_email",
                        user.email || email
                    );


                    /*
                     * Multiple SaaS / Library
                     * management will use the
                     * Manager UID as the master
                     * identity.
                     */

                    localStorage.setItem(
                        "manager_authorized",
                        "true"
                    );


                    /*
                     * STEP 5
                     * Open Master Dashboard
                     */

                    window.location.href =
                        "manager.html";

                }

                catch (error) {

                    console.error(
                        "[Master Manager Login Error]",
                        error
                    );


                    let message =
                        "Login failed. Please verify your credentials.";


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        message =
                            "Invalid Manager Email or Password.";

                    }
                    else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        message =
                            "Manager account was not found.";

                    }
                    else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        message =
                            "Invalid Manager Password.";

                    }
                    else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        message =
                            "Too many login attempts. Please try again later.";

                    }


                    alert(message);

                }

                finally {

                    loginButton.disabled =
                        false;

                    loginButton.textContent =
                        "Execute Authorization";

                }

            }
        );

    }
);

</script>

</body>

</html>
