<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LibControl - Manager Login</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<div class="gateway-container">

    <div class="gateway-header">

        <h1>
            LibControl
        </h1>

        <p>
            Master Manager
        </p>

    </div>


    <div class="gateway-card glass">

        <div class="auth-panel active">

            <h2>
                Manager Login
            </h2>

            <p class="panel-subtitle">
                Sign in with your authorized Master Manager account.
            </p>


            <form
                id="admin-login-form"
                autocomplete="on"
            >


                <div class="form-group">

                    <label for="admin-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        name="email"
                        placeholder="Enter manager email"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="manager-login-error"
                    style="
                        display:none;
                        margin-bottom:1rem;
                        padding:0.75rem;
                        border-radius:8px;
                        background:#fee2e2;
                        color:#991b1b;
                        font-size:0.85rem;
                        font-weight:600;
                    "
                ></div>


                <button
                    type="submit"
                    id="manager-login-submit"
                    class="btn-gateway-submit btn-manager-override"
                >
                    Manager Login
                </button>


            </form>

        </div>

    </div>

</div>



<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<script>

/* ==========================================================================
   LIBCONTROL FIREBASE CONFIG
   ========================================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCUe84QnEA5DY31DXtzM-7M4Xu5bSa8xO8",

    authDomain:
        "appointment-app-cb979.firebaseapp.com",

    projectId:
        "appointment-app-cb979",

    storageBucket:
        "appointment-app-cb979.firebasestorage.app",

    messagingSenderId:
        "596931961212",

    appId:
        "1:596931961212:web:adc604e0a47f63fd9104f"

};


/* ==========================================================================
   FIREBASE INITIALIZATION
   ========================================================================== */

if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}

const db =
    firebase.firestore();

const auth =
    firebase.auth();


/* ==========================================================================
   DOM
   ========================================================================== */

const loginForm =
    document.getElementById(
        "admin-login-form"
    );

const emailInput =
    document.getElementById(
        "admin-email"
    );

const passwordInput =
    document.getElementById(
        "admin-password"
    );

const loginButton =
    document.getElementById(
        "manager-login-submit"
    );

const errorBox =
    document.getElementById(
        "manager-login-error"
    );


/* ==========================================================================
   ERROR DISPLAY
   ========================================================================== */

function showLoginError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


function clearLoginError() {

    errorBox.textContent =
        "";

    errorBox.style.display =
        "none";

}


/* ==========================================================================
   MANAGER LOGIN
   ========================================================================== */

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();

        clearLoginError();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();

        const password =
            passwordInput.value;


        if (!email || !password) {

            showLoginError(
                "Please enter email and password."
            );

            return;

        }


        loginButton.disabled =
            true;

        loginButton.textContent =
            "Signing in...";


        try {

            /*
             * Firebase Authentication
             */

            const credential =
                await auth
                    .signInWithEmailAndPassword(
                        email,
                        password
                    );


            const user =
                credential.user;


            if (!user) {

                throw new Error(
                    "Authentication failed."
                );

            }


            /*
             * Master Manager authorization
             *
             * IMPORTANT:
             * Login account alone is NOT enough.
             */

            const managerDoc =
                await db
                    .collection(
                        "master_managers"
                    )
                    .doc(user.uid)
                    .get();


            if (!managerDoc.exists) {

                await auth.signOut();

                showLoginError(
                    "Access Denied: This Firebase account is not registered as a Master Manager."
                );

                return;

            }


            const managerData =
                managerDoc.data() || {};


            if (
                managerData.role !==
                "master_manager"
            ) {

                await auth.signOut();

                showLoginError(
                    "Access Denied: Invalid Master Manager role."
                );

                return;

            }


            if (
                managerData.enabled ===
                false
            ) {

                await auth.signOut();

                showLoginError(
                    "Access Denied: Master Manager account is disabled."
                );

                return;

            }


            /*
             * Save ONLY non-sensitive session information.
             *
             * Password is NEVER stored.
             */

            localStorage.setItem(
                "session_role",
                "master_manager"
            );

            localStorage.setItem(
                "session_manager_uid",
                user.uid
            );

            localStorage.setItem(
                "session_manager_email",
                user.email || email
            );


            /*
             * IMPORTANT:
             *
             * manager-login.html is already inside /pages/
             * and manager.html is also inside /pages/.
             *
             * Therefore:
             *
             * manager.html
             *
             * NOT:
             *
             * pages/manager.html
             */

            window.location.href =
                "manager-dashboard.html";


        }
        catch (error) {

            console.error(
                "[LibControl Manager Login Error]",
                error
            );


            let message =
                "Login failed. Please try again.";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "Invalid email or password.";

            }
            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "No Firebase account exists with this email.";

            }
            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "Invalid email or password.";

            }
            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                message =
                    "Too many login attempts. Please try again later.";

            }
            else if (
                error.code ===
                "auth/network-request-failed"
            ) {

                message =
                    "Network error. Please check your internet connection.";

            }
            else if (
                error.code ===
                "permission-denied"
            ) {

                message =
                    "Firestore permission denied. Security rules need to allow authorized Manager verification.";

            }


            showLoginError(
                message
            );

        }
        finally {

            loginButton.disabled =
                false;

            loginButton.textContent =
                "Manager Login";

        }

    }
);


/* ==========================================================================
   PREVENT OLD MANAGER SESSION FROM CAUSING CONFUSION
   ========================================================================== */

auth.onAuthStateChanged(
    function (user) {

        if (!user) {

            /*
             * Do not redirect here.
             * Login page must remain accessible.
             */

            return;

        }

    }
);

</script>


</body>

</html>
